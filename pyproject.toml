[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wiguard"
version = "0.3.0"
description = "Passive, explainable Evil Twin detector for Wi-Fi."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "scapy>=2.5",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
wiguard = "wiguard.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "hypothesis>=6.100",
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wiguard.runtime" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["scapy.*"]
ignore_missing_imports = true
