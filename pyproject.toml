[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiguard"
version = "0.1.0"
description = "Passive Evil Twin access point detector foundation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0",
  "scapy>=2.5.0",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
wiguard-analyze-pcap = "wiguard.pcap_analyzer:main"
wiguard-api = "wiguard.api.server:main"
wiguard-evaluate-fixtures = "wiguard.evaluation.runner:main"
wiguard-generate-fixtures = "wiguard.evaluation.synthetic:main"
wiguard-scan = "wiguard.cli:main"
wiguard-sensor = "wiguard.runtime.sensor:main"

[tool.setuptools.packages.find]
where = ["wiguard/src"]
